<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>Sign in · ADWILAGO</title>
    <style>
        :root { color-scheme: dark; --bg: #0b1220; --panel: #111c2e; --border: #263449; --text: #e7edf7; --muted: #8d9ab0; --accent: #45d6b0; --danger: #f18b94; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 0, #14253a, var(--bg) 62%); color: var(--text); font: 15px/1.5 "DM Sans", "Segoe UI", sans-serif; }
        .login-card { width: min(100%, 410px); padding: 34px; border: 1px solid var(--border); border-radius: 14px; background: color-mix(in srgb, var(--panel) 94%, transparent); box-shadow: 0 22px 70px #0006; }
        .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
        .brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 10px; background: #45d6b018; color: var(--accent); font: 700 22px/1 "Space Grotesk", "Segoe UI", sans-serif; }
        .brand p { margin: 0; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
        .brand h1 { margin: 2px 0 0; font: 700 18px/1.2 "Space Grotesk", "Segoe UI", sans-serif; letter-spacing: .04em; }
        h2 { margin: 0 0 7px; font: 600 23px/1.25 "Space Grotesk", "Segoe UI", sans-serif; }
        .subtitle { margin: 0 0 24px; color: var(--muted); }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
        input { width: 100%; min-height: 46px; padding: 11px 13px; border: 1px solid var(--border); border-radius: 8px; outline: none; background: #0b1422; color: var(--text); font: inherit; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #45d6b01c; }
        button { width: 100%; min-height: 45px; margin-top: 18px; border: 0; border-radius: 8px; background: var(--accent); color: #071610; cursor: pointer; font: 700 14px/1 "DM Sans", "Segoe UI", sans-serif; }
        button:hover { filter: brightness(1.06); }
        .error { margin: 0 0 16px; padding: 10px 12px; border: 1px solid #f18b9440; border-radius: 7px; background: #f18b9410; color: var(--danger); font-size: 13px; }
        .foot { margin: 22px 0 0; color: var(--muted); font-size: 11px; text-align: center; }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand"><div class="brand-mark" aria-hidden="true">A</div><div><p>Market intelligence</p><h1>ADWILAGO</h1></div></div>
        <h2>Sign in</h2>
        <p class="subtitle">Enter your dashboard password to continue.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="/login" autocomplete="on">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="password">Dashboard password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            <button type="submit">Sign in securely</button>
        </form>
        <p class="foot">Manual review only · Trading remains disabled</p>
    </main>
</body>
</html>
